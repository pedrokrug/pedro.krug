<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sesión de trabajo · Pedro Krug</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ece5d7">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" as="font" type="font/woff2" href="/fonts/ClashDisplay-600.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-var.woff2" crossorigin>
<style>
  @font-face{font-family:'Clash';src:url(/fonts/ClashDisplay-500.woff2) format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Clash';src:url(/fonts/ClashDisplay-600.woff2) format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'InterV';src:url(/fonts/Inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'MonoV';src:url(/fonts/JetBrainsMono-var.woff2) format('woff2');font-weight:100 800;font-display:swap}

  /* single light theme: rice paper ground, warm near-black ink, seal red as the one accent */
  :root{
    --bg:#ece5d7; --field:#f5f0e6; --field-2:#fbf8f2;
    --fg:#171310; --dim:#5e564b; --faint:#8a8173;
    --seal:#cf3620; --seal-hi:#b52d19; --ok:#4d7a3c;
    --line:rgba(23,19,16,.14); --line-2:rgba(23,19,16,.3);
    --disp:'Clash','InterV','Helvetica Neue',sans-serif;
    --body:'InterV','Helvetica Neue',Arial,sans-serif;
    --mono:'MonoV',ui-monospace,Menlo,monospace;
    --gut:clamp(16px,4vw,56px);
    --bar:60px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:calc(var(--bar) + 24px)}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
  ::selection{background:var(--seal);color:#fff}
  a{color:inherit}
  button{font:inherit;color:inherit}
  h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.025em}
  p{margin:0}
  em{font-style:italic}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .seal{color:var(--seal)}
  .paren{font-family:var(--disp);font-weight:500;color:var(--seal)}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--seal);outline-offset:3px}

  /* ============ BUTTONS ============ */
  .btn{appearance:none;border:1px solid var(--seal);background:var(--seal);color:#fff;cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    padding:16px 22px;display:inline-flex;align-items:center;gap:14px;text-decoration:none;
    transition:background .2s,border-color .2s,color .2s}
  .btn:hover{background:var(--seal-hi);border-color:var(--seal-hi)}
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--fg)}
  .btn.ghost:hover{border-color:var(--fg)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn .ar{font-family:var(--body);letter-spacing:0;font-size:15px;line-height:1}
  .link{appearance:none;background:none;border:0;padding:6px 0;cursor:pointer;font-family:var(--mono);font-size:11px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none}
  .link:hover{color:var(--fg)}

  /* ============ BAR ============ */
  .bar{position:sticky;top:0;z-index:50;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 var(--gut);background:rgba(236,229,215,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .bar-l{display:flex;align-items:center;gap:14px;min-width:0}
  .bar-l a{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
  .bar-l img{height:30px;width:auto;display:block}
  .bar-l .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-r{display:flex;align-items:center;gap:clamp(12px,2.4vw,26px)}
  .count{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}
  .count b{color:var(--fg);font-weight:500}
  .saved{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .saved i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:block;transition:background .3s}
  .saved[data-s="ok"] i{background:var(--ok)}
  .saved[data-s="busy"] i{background:var(--dim);animation:blink 1s ease-in-out infinite}
  .saved[data-s="err"]{color:var(--seal)} .saved[data-s="err"] i{background:var(--seal)}
  @keyframes blink{50%{opacity:.25}}
  .progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--seal);width:0;transition:width .5s ease}
  @media(max-width:560px){.saved span{display:none}.bar-l .mono{display:none}}

  /* ============ VIEW TRANSITION ============ */
  .view{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .resolve{animation:resolve 1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes resolve{from{filter:blur(14px);opacity:0}to{filter:blur(0);opacity:1}}
  @media(prefers-reduced-motion:reduce){.view,.resolve{animation:none}.progress{transition:none}}

  /* ============ LOGIN ============ */
  .login{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(20px,4vh,40px) var(--gut)}
  .login .top{display:flex;justify-content:space-between;align-items:center}
  .login .top img{height:38px}
  .login .mid{align-self:center;max-width:1100px;width:100%;margin:0 auto;padding:clamp(40px,8vh,90px) 0}
  .login h1{font-size:clamp(46px,8.4vw,128px);line-height:.88;letter-spacing:-.045em;margin:0 0 clamp(26px,4vh,40px)}
  .login h1 .l2{display:block;color:var(--dim)}
  .login .lede{max-width:44ch;color:var(--dim);font-size:clamp(15px,1.4vw,17px)}
  .login form{margin-top:clamp(28px,5vh,48px);display:flex;flex-wrap:wrap;gap:12px;max-width:620px}
  .code{flex:1 1 300px;min-width:0;background:var(--field);border:1px solid var(--line-2);color:var(--fg);
    font-family:var(--mono);font-size:clamp(17px,2vw,21px);letter-spacing:.18em;text-transform:uppercase;padding:15px 18px;border-radius:0}
  .code::placeholder{color:var(--faint)}
  .code:focus{outline:none;border-color:var(--seal)}
  .err{color:var(--seal);font-size:14px;margin-top:14px;max-width:52ch}
  .login .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:18px}

  /* ============ WELCOME ============ */
  .wrap{max-width:880px;margin:0 auto;padding:clamp(36px,7vh,80px) var(--gut) clamp(56px,9vh,100px)}
  .welcome h1{font-size:clamp(44px,7vw,96px);line-height:.88;letter-spacing:-.045em;margin:0 0 22px}
  .welcome .lede{max-width:56ch;color:var(--fg);font-size:clamp(16px,1.5vw,18px);line-height:1.55}
  .how{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:20px}
  .how p{color:var(--dim);font-size:14.5px;display:flex;gap:10px}
  .how p::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--seal);flex:0 0 5px;margin-top:9px}

  .parts{margin-top:clamp(32px,6vh,52px);border-top:1px solid var(--line)}
  .prow{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;cursor:pointer;color:var(--fg)}
  .prow .pn{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--faint)}
  .prow .pt{font-family:var(--disp);font-weight:600;font-size:clamp(20px,2.2vw,26px);letter-spacing:-.02em;line-height:1.05;transition:color .2s}
  .prow .pi{color:var(--dim);font-size:14px;margin-top:3px;display:block}
  .prow .pc{text-align:right;min-width:84px}
  .prow:hover .pt{color:var(--seal)}
  .meter{height:2px;background:var(--line);margin-top:8px;position:relative;overflow:hidden;display:block}
  .meter i{position:absolute;inset:0 auto 0 0;background:var(--seal);display:block}
  .cta{margin-top:clamp(28px,5vh,44px);display:flex;gap:12px;flex-wrap:wrap;align-items:center}

  /* ============ VOICE STAGE ============ */
  /* The conversation opens as a dark stage that grows out of the button (clip-path circle)
     and covers the page; the living shape in the middle is drawn on a canvas. */
  .textlink{appearance:none;background:none;border:0;padding:8px 2px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--dim);
    text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-2);transition:color .2s}
  .textlink:hover{color:var(--fg);text-decoration-color:var(--fg)}
  .stage{position:fixed;inset:0;z-index:200;background:#0c0b0a;color:#f3efe6;display:grid;grid-template-rows:auto 1fr auto;
    clip-path:circle(0px at var(--sx,50%) var(--sy,50%));transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
  .stage.open{clip-path:circle(150vmax at var(--sx,50%) var(--sy,50%))}
  .stage.closing{transition-duration:.7s}
  .stage-top{display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:center;gap:18px;padding:18px var(--gut)}
  .stage-top .stage-close{justify-self:end}
  .vprog{display:flex;flex-direction:column;gap:8px;opacity:0;transition:opacity .6s ease .8s}
  .stage.open .vprog{opacity:1}
  .vsegs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .vseg{display:flex;flex-direction:column;gap:6px;min-width:0}
  .vseg b{display:block;height:3px;background:rgba(243,239,230,.14);position:relative;overflow:hidden}
  .vseg b i{position:absolute;inset:0 auto 0 0;width:0;background:#cf3620;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .vseg span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#665f54;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;transition:color .4s}
  .vseg.on span{color:#f3efe6}
  .vseg.pulse b{box-shadow:0 0 0 1px #cf3620}
  .vmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#9c9384}
  .vmeta .late{color:#cf3620}
  @media(max-width:700px){.stage-top{grid-template-columns:1fr auto;row-gap:14px}.vprog{grid-column:1 / -1;grid-row:2}.vseg span{display:none}}
  .stage-top .mono{color:#8a8173}
  .stage-close{appearance:none;background:none;border:1px solid rgba(243,239,230,.24);color:#f3efe6;border-radius:999px;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:10px 16px;transition:border-color .2s}
  .stage-close:hover{border-color:#f3efe6}
  .stage-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--gut);text-align:center;min-height:0;overflow:hidden}
  .stage canvas{width:min(52vmin,40vh,460px);height:min(52vmin,40vh,460px);flex:0 0 auto;display:block;cursor:pointer;opacity:0;transform:scale(.6);
    transition:opacity .9s ease .45s,transform 1.1s cubic-bezier(.2,.8,.2,1) .35s}
  .stage.open canvas{opacity:1;transform:none}
  .stage .vstate{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#9c9384;min-height:16px;margin-top:6px;
    opacity:0;transition:opacity .6s ease .9s}
  .stage.open .vstate{opacity:1}
  .stage .captions{width:min(100%,920px);margin-top:18px;max-height:min(13em,30vh);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .stage .captions .ai{font-size:clamp(15px,1.45vw,17px);line-height:1.5;color:#f3efe6;margin:0}
  .stage .captions .me{color:#9c9384;font-size:14.5px;line-height:1.5;margin:0 0 8px}
  .stage .captions .me:not(:empty)::before{content:'Tú · ';font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#665f54}
  .stage-foot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px var(--gut) 26px;text-align:center;background:#0c0b0a;position:relative;z-index:1}
  .stage .textlink{color:#9c9384;text-decoration-color:rgba(243,239,230,.25)}
  .stage .textlink:hover{color:#f3efe6}
  .stage .micnote{color:#665f54;font-size:12.5px;margin:0}
  .stage .verr{color:#cf3620;font-size:14.5px;margin-top:14px}
  .stage .again{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .stage .btn.ghost{color:#f3efe6;border-color:rgba(243,239,230,.3)}
  .stage .btn.ghost:hover{border-color:#f3efe6}
  @media(prefers-reduced-motion:reduce){.stage,.stage canvas,.stage .vstate{transition:none}}

  /* ============ PART SCREEN ============ */
  .steps{display:flex;gap:6px;margin:0 0 26px}
  .steps button{flex:1;appearance:none;border:0;background:none;padding:8px 0 0;cursor:pointer;text-align:left;border-top:2px solid var(--line);
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .steps button.done{border-top-color:rgba(207,54,32,.5);color:var(--dim)}
  .steps button[aria-current="true"]{border-top-color:var(--seal);color:var(--fg)}
  @media(max-width:620px){.steps button span{display:none}}
  .screen h2{font-size:clamp(32px,4.4vw,52px);line-height:.95;letter-spacing:-.035em;margin:0 0 8px}
  .screen .intro{color:var(--dim);font-size:15px;margin-bottom:clamp(20px,4vh,34px)}
  .tp{border-top:1px solid var(--line-2);padding-top:18px;margin-top:clamp(22px,4vh,36px)}
  .tp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .tp-h h3{font-size:clamp(19px,2vw,23px);letter-spacing:-.015em;line-height:1.1;font-weight:600}
  .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#fff;background:var(--seal);padding:3px 6px 2px}
  .ctx{color:var(--dim);font-size:14px;line-height:1.55;margin-top:6px;max-width:68ch}

  .q{padding:14px 0 4px}
  .qt{font-size:16px;line-height:1.45;font-weight:500;margin-bottom:8px}
  .hint{color:var(--faint);font-size:13.5px;margin:-4px 0 8px}
  textarea{display:block;width:100%;min-height:48px;resize:none;background:var(--field);border:1px solid var(--line);color:var(--fg);
    font-family:var(--body);font-size:15.5px;line-height:1.5;padding:11px 14px;border-radius:0;transition:border-color .2s,background .2s;overflow:hidden}
  textarea::placeholder{color:var(--faint)}
  textarea:hover{border-color:var(--line-2)}
  textarea:focus{outline:none;border-color:var(--seal);background:var(--field-2)}
  .choice{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opt{position:relative}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:inline-block;border:1px solid var(--line-2);padding:9px 13px;font-size:14px;cursor:pointer;color:var(--dim);transition:all .2s;user-select:none;white-space:nowrap}
  .opt span:hover{color:var(--fg);border-color:var(--fg)}
  .opt input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .opt input:focus-visible+span{outline:2px solid var(--seal);outline-offset:2px}
  textarea.note{flex:1 1 200px;min-height:40px;font-size:14px;padding:9px 12px}
  /* checklist rows: label left, pills right */
  .srow{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .srow .qt{margin:0;font-weight:400;font-size:15px}
  .srow .opt span{padding:7px 10px;font-size:13px}
  @media(max-width:700px){.srow{grid-template-columns:1fr}}

  .pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:22px;margin-top:clamp(28px,5vh,44px)}
  .pager .btn.ghost:only-child{margin-left:auto}

  /* ============ END ============ */
  .end h1{font-size:clamp(44px,7vw,96px);line-height:.88;letter-spacing:-.045em;margin:0 0 20px}
  .end .lede{max-width:56ch;color:var(--dim);font-size:clamp(15px,1.4vw,17px)}
  .stat{display:flex;align-items:baseline;gap:14px;margin:clamp(24px,4vh,36px) 0 0;flex-wrap:wrap}
  .stat .big{font-family:var(--disp);font-weight:600;font-size:clamp(52px,7vw,84px);line-height:.8;letter-spacing:-.04em;color:var(--seal)}
  .gaps{margin-top:28px;border-top:1px solid var(--line)}
  .gap{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer;color:var(--fg);text-align:left;font-size:15px}
  .gap:hover{color:var(--seal)}
  .gap .mono{white-space:nowrap}
  .done-note{margin-top:18px;color:var(--ok);font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}

  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .loading .mono{animation:blink 1.2s ease-in-out infinite}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;font-size:14px;z-index:90;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="mono">Cargando</span></div></div>
<noscript><p style="padding:40px">Esta página necesita JavaScript.</p></noscript>

<script>
(() => {
  'use strict';
  const $app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  // content marks quoted phrases as *text*; they render in italics
  const fmt = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const plain = (s) => String(s ?? '').replace(/\*/g, '');
  const pad = (n) => String(n).padStart(2, '0');
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  let S = null;          // {user, content, answers, status}
  let dirty = new Map(); // qid -> {answer, note, v}
  let inflight = false, timer = null, retry = 0, ver = 0;

  // ---------------------------------------------------------------- api
  // One n8n webhook does everything: it checks the person's code, returns the questions
  // and reads or writes the Sheet. The code travels with every request and is kept in
  // this browser so nobody has to type it twice. text/plain keeps the request "simple",
  // so the browser sends it without a CORS preflight (and keepalive works on page exit).
  const API = 'https://krug.app.n8n.cloud/webhook/krug-sesion';
  const CODE_KEY = 'pk_sesion_code';
  async function api(action, extra = {}, opts = {}) {
    const r = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: JSON.stringify({action, code: store.get(CODE_KEY) || '', ...extra}),
      keepalive: !!opts.keepalive,
    });
    let data = {};
    try { data = await r.json(); } catch {}
    if (!r.ok) { const e = new Error(data.error || r.status); e.status = r.status; throw e; }
    return data;
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    const m = location.hash.match(/acceso=([A-Za-z0-9-]+)/);
    if (m) {
      history.replaceState(null, '', location.pathname);
      store.set(CODE_KEY, m[1]);
    }
    if (!store.get(CODE_KEY)) return renderLogin();
    try {
      S = await api('state');
    } catch (e) {
      if (e.status === 401) { store.del(CODE_KEY); return renderLogin(m ? 'Ese enlace no es válido. Revisa el código o escríbeme a pedro@pedrokrug.com.' : ''); }
      $app.innerHTML = `<div class="loading"><div style="text-align:center;padding:0 20px"><p class="mono seal">No se ha podido cargar</p><p style="color:var(--dim);margin-top:12px">Vuelve a intentarlo en un momento.</p><button class="btn ghost" style="margin-top:24px" onclick="location.reload()">Reintentar</button></div></div>`;
      return;
    }
    // anything typed but not confirmed by the server last time goes back in and gets sent
    const draft = store.get(draftKey()) || {};
    for (const [qid, d] of Object.entries(draft)) {
      S.answers[qid] = {answer: d.answer, note: d.note};
      dirty.set(qid, {answer: d.answer, note: d.note, v: ++ver});
    }
    if (dirty.size) schedule(300);
    window.removeEventListener('hashchange', route);
    window.addEventListener('hashchange', route);
    route();
  }
  const draftKey = () => 'pk_sesion_draft_' + S.user.id;

  // ---------------------------------------------------------------- counts
  const hasAnswer = (qid) => { const a = S.answers[qid]; return !!a && (String(a.answer || '').trim() !== '' || String(a.note || '').trim() !== ''); };
  const partQ = (p) => p.topics.flatMap((t) => t.questions);
  const allQ = () => S.content.parts.flatMap(partQ);
  const answeredCount = () => allQ().filter((q) => hasAnswer(q.id)).length;
  const partCount = (p) => { const qs = partQ(p); return [qs.filter((q) => hasAnswer(q.id)).length, qs.length]; };

  // ---------------------------------------------------------------- router
  function route() {
    const h = location.hash;
    if (h !== '#/voz' && stage) closeVoice();
    if (h === '#/voz') {
      // the stage sits on top of the welcome screen; opened directly it waits for a tap (the mic needs a gesture)
      if (!stage) { window.scrollTo(0, 0); renderWelcome(); if (voiceOn()) openVoice(null, false); }
      return;
    }
    window.scrollTo(0, 0);
    const m = h.match(/^#\/p\/([A-Za-z0-9]+)/);
    if (m) {
      const i = S.content.parts.findIndex((x) => x.id === m[1]);
      if (i >= 0) { store.set('pk_sesion_last_' + S.user.id, S.content.parts[i].id); return renderPart(i); }
    }
    if (h === '#/fin') return renderEnd();
    renderWelcome();
  }
  const go = (hash) => { flushNow(); if (location.hash === hash) route(); else location.hash = hash; };

  // ---------------------------------------------------------------- bar
  function bar() {
    const total = allQ().length, done = answeredCount();
    return `<header class="bar">
      <div class="bar-l"><a href="#/" aria-label="Inicio de la sesión"><img src="/sesion/pk.svg" alt=""><span class="mono">${esc(S.content.client)}</span></a></div>
      <div class="bar-r">
        <span class="count" id="count"><b>${done}</b> / ${total}</span>
        <span class="saved" id="saved" data-s="ok" aria-live="polite"><i></i><span>Guardado</span></span>
        <button class="link" id="logout">Salir</button>
      </div>
      <div class="progress" id="progress" style="width:${total ? (done / total) * 100 : 0}%"></div>
    </header>`;
  }
  function wireBar() {
    document.getElementById('logout').onclick = async () => {
      await flushNow();
      store.del(CODE_KEY);
      location.hash = ''; location.reload();
    };
    setSaved(dirty.size ? 'busy' : 'ok');
  }
  function refreshCounts() {
    const total = allQ().length, done = answeredCount();
    const c = document.getElementById('count'); if (c) c.innerHTML = `<b>${done}</b> / ${total}`;
    const p = document.getElementById('progress'); if (p) p.style.width = (total ? (done / total) * 100 : 0) + '%';
  }
  function setSaved(s) {
    const el = document.getElementById('saved'); if (!el) return;
    el.dataset.s = s;
    el.querySelector('span').textContent = s === 'busy' ? 'Guardando' : s === 'err' ? 'Sin conexión, reintentando' : 'Guardado';
  }

  // ---------------------------------------------------------------- login
  function renderLogin(msg) {
    document.title = 'Sesión de trabajo · Pedro Krug';
    $app.innerHTML = `<main class="login view">
      <div class="top"><img src="/sesion/pk.svg" alt="Pedro Krug"><span class="mono">Acceso privado</span></div>
      <div class="mid">
        <h1 class="resolve">Una conversación,<span class="l2">por escrito.</span></h1>
        <p class="lede">Escribe el código que te he enviado. Tus respuestas se guardan a medida que escribes y puedes volver cuando quieras.</p>
        <form id="lf" autocomplete="off">
          <label for="code" class="mono" style="position:absolute;left:-9999px">Código de acceso</label>
          <input id="code" class="code" name="code" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" required>
          <button class="btn" type="submit">Entrar <span class="ar">→</span></button>
        </form>
        <p class="err" id="lerr" ${msg ? '' : 'hidden'}>${esc(msg || '')}</p>
      </div>
      <div class="foot"><span class="mono">Pedro Krug · marca y sistemas · Valencia</span><a class="mono" href="mailto:pedro@pedrokrug.com" style="text-decoration:none">pedro@pedrokrug.com</a></div>
    </main>`;
    const f = document.getElementById('lf'), inp = document.getElementById('code'), err = document.getElementById('lerr');
    inp.focus();
    f.onsubmit = async (e) => {
      e.preventDefault();
      const b = f.querySelector('button'); b.disabled = true; err.hidden = true;
      try {
        const code = inp.value.trim();
        store.set(CODE_KEY, code);
        try { await api('state'); } catch (x) { store.del(CODE_KEY); throw x; }
        $app.innerHTML = '<div class="loading"><span class="mono">Cargando</span></div>';
        boot();
      } catch (x) {
        b.disabled = false;
        err.textContent = x.status === 401
          ? 'Ese código no es válido. Revísalo o escríbeme a pedro@pedrokrug.com.'
          : 'No se ha podido conectar. Vuelve a intentarlo en un momento.';
        err.hidden = false; inp.select();
      }
    };
  }

  // ---------------------------------------------------------------- welcome
  function renderWelcome() {
    const c = S.content, w = c.welcome;
    const last = store.get('pk_sesion_last_' + S.user.id);
    const started = answeredCount() > 0;
    const start = started && c.parts.some((p) => p.id === last) ? last : c.parts[0].id;
    document.title = `${c.title} · ${c.client}`;
    $app.innerHTML = bar() + `<main class="wrap welcome view">
      <h1 class="resolve">Hola, ${esc(S.user.name)}<span class="seal">.</span></h1>
      <p class="lede">${fmt(w.lede)}</p>
      <div class="how">${w.how.map((h) => `<p><span>${fmt(h)}</span></p>`).join('')}</div>
      <div class="cta">
        ${voiceOn() ? `<button class="btn" data-voice>${esc(w.voiceCta || 'Empezar a hablar')} <span class="ar">●</span></button>
        <button class="textlink" data-go="${start}">${started ? 'Seguir por escrito' : esc(w.formCta || 'Prefiero escribir')}</button>`
        : `<button class="btn" data-go="${start}">${started ? 'Seguir' : 'Empezar'} <span class="ar">→</span></button>`}
        ${started ? '<button class="btn ghost" data-end>Resumen</button>' : ''}
      </div>
      <nav class="parts" aria-label="Partes">
        ${c.parts.map((p, i) => { const [a, n] = partCount(p); return `<button class="prow" data-go="${p.id}">
          <span class="pn">${pad(i + 1)}</span>
          <span><span class="pt">${esc(p.title)}</span><span class="pi">${fmt(p.intro)}</span></span>
          <span class="pc"><span class="mono">${a ? `${a} / ${n}` : `${n} preguntas`}</span><span class="meter"><i style="width:${(a / n) * 100}%"></i></span></span>
        </button>`; }).join('')}
      </nav>
    </main>`;
    wireBar();
    wireNav();
  }
  function wireNav() {
    $app.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go('#/p/' + b.dataset.go));
    $app.querySelectorAll('[data-end]').forEach((b) => b.onclick = () => go('#/fin'));
    $app.querySelectorAll('[data-voice]').forEach((b) => b.onclick = () => openVoice(b, true));
  }
  const voiceOn = () => S.user.voice !== false && !store.get('pk_sesion_novoice_' + S.user.id);

  // ---------------------------------------------------------------- part screen
  function opts(q, list, a) {
    return `<div class="opts" role="radiogroup" aria-label="${esc(plain(q.text))}">${list.map((o) => `<label class="opt"><input type="radio" name="${esc(q.id)}" value="${esc(o)}" ${a.answer === o ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>`;
  }
  function field(q) {
    const a = S.answers[q.id] || {};
    if (q.type === 'status') {
      return `<div class="srow"><p class="qt">${fmt(q.text)}</p>${opts(q, S.content.statusOptions, a)}</div>`;
    }
    const hint = q.hint ? `<p class="hint">${fmt(q.hint)}</p>` : '';
    if (q.type === 'choice') {
      return `<div class="q"><p class="qt">${fmt(q.text)}</p>${hint}<div class="choice">${opts(q, q.options, a)}
        <textarea class="note" data-q="${esc(q.id)}" data-f="note" rows="1" aria-label="Comentario" placeholder="Comentario (opcional)">${esc(a.note || '')}</textarea></div></div>`;
    }
    return `<div class="q"><label class="qt" for="f-${esc(q.id)}" style="display:block">${fmt(q.text)}</label>${hint}
      <textarea id="f-${esc(q.id)}" data-q="${esc(q.id)}" data-f="answer" rows="1" placeholder="Escribe aquí…">${esc(a.answer || '')}</textarea></div>`;
  }

  function renderPart(i) {
    const parts = S.content.parts, p = parts[i], prev = parts[i - 1], next = parts[i + 1];
    document.title = `${p.title} · ${S.content.client}`;
    const single = p.topics.length === 1 && !p.topics[0].context;
    $app.innerHTML = bar() + `<main class="wrap screen view">
      <div class="steps">${parts.map((x, j) => { const [a, n] = partCount(x); return `<button data-go="${x.id}" class="${a === n ? 'done' : ''}" aria-current="${j === i}" aria-label="${esc(x.title)}">${pad(j + 1)}<span> · ${esc(x.title)}</span></button>`; }).join('')}</div>
      <h2>${esc(p.title)}</h2>
      <p class="intro">${fmt(p.intro)}</p>
      ${p.topics.map((t) => single ? t.questions.map(field).join('') : `<section class="tp">
        <div class="tp-h"><h3>${esc(t.title)}</h3>${t.key ? '<span class="chip">Clave</span>' : ''}</div>
        ${t.context ? `<p class="ctx">${fmt(t.context)}</p>` : ''}
        ${t.questions.map(field).join('')}
      </section>`).join('')}
      <div class="pager">
        ${prev ? `<button class="btn ghost" data-go="${prev.id}"><span class="ar">←</span> ${esc(prev.title)}</button>` : ''}
        ${next ? `<button class="btn" data-go="${next.id}">${esc(next.title)} <span class="ar">→</span></button>`
               : `<button class="btn" data-end>Terminar <span class="ar">→</span></button>`}
      </div>
    </main>`;
    wireBar();
    wireNav();
    $app.querySelectorAll('textarea').forEach((ta) => {
      grow(ta);
      ta.addEventListener('input', () => { grow(ta); edit(ta.dataset.q, ta.dataset.f, ta.value); });
      ta.addEventListener('blur', () => flushNow());
    });
    $app.querySelectorAll('.opt input').forEach((r) => {
      r.addEventListener('change', () => { edit(r.name, 'answer', r.value); flushNow(); });
      // clicking the chosen option again clears it
      r.parentElement.addEventListener('mousedown', () => { r.dataset.was = r.checked ? '1' : ''; });
      r.addEventListener('click', () => { if (r.dataset.was) { r.checked = false; r.dataset.was = ''; edit(r.name, 'answer', ''); flushNow(); } });
    });
  }
  function grow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }

  // ---------------------------------------------------------------- end
  function renderEnd() {
    const total = allQ().length, done = answeredCount(), finished = S.status && S.status.done;
    const gaps = S.content.parts.map((p) => [p, partCount(p)]).filter(([, [a, n]]) => a < n);
    document.title = `Resumen · ${S.content.client}`;
    $app.innerHTML = bar() + `<main class="wrap end view">
      <h1 class="resolve">${finished ? esc(S.content.closing.title) : done === total ? 'Todo respondido<span class="seal">.</span>' : 'Casi está<span class="seal">.</span>'}</h1>
      <p class="lede">${finished ? fmt(S.content.closing.lede) : 'Lo que quede en blanco lo vemos en persona. Cuando lo tengas, dalo por terminado.'}</p>
      <div class="stat"><span class="big">${done}</span><span class="mono">de ${total} respondidas</span></div>
      ${gaps.length && !finished ? `<div class="gaps">${gaps.map(([p, [a, n]]) => `<button class="gap" data-go="${p.id}"><span>${esc(p.title)}</span><span class="mono">faltan ${n - a}</span></button>`).join('')}</div>` : ''}
      <div class="cta">
        <button class="btn" id="finish" ${finished ? 'disabled' : ''}>${finished ? 'Terminado' : 'Dar por terminado'} <span class="ar">${finished ? '✓' : '→'}</span></button>
        <button class="btn ghost" data-go="${S.content.parts[0].id}">Revisar</button>
      </div>
      ${finished ? '<p class="done-note">Recibido. Puedes seguir editando.</p>' : ''}
    </main>`;
    wireBar();
    wireNav();
    const f = document.getElementById('finish');
    f.onclick = async () => {
      f.disabled = true;
      await flushNow();
      try {
        await api('finish', {done: true, answered: answeredCount(), total: allQ().length});
        S.status = {...(S.status || {}), done: true};
        renderEnd();
      } catch { f.disabled = false; toast('No se ha podido enviar. Vuelve a intentarlo.'); }
    };
  }

  // ---------------------------------------------------------------- voice
  // A live conversation with the ElevenLabs agent. n8n checks the code and hands back a
  // short-lived private session URL; the agent saves answers through the same webhook.
  const SDK = 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.25.0/+esm';
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let conv = null, closing = '', endTimer = null, raf = 0, mode = 'idle', stage = null, level = 0, speak = 0, heard = 0;
  let clock = 0, t0 = 0, sent = {}, refetch = 0, linked = false;
  const LIMIT = 15 * 60;

  // open the stage from a point (the button that was pressed); autostart keeps the click's user gesture
  function openVoice(origin, autostart) {
    if (stage) return;
    if (location.hash !== '#/voz') history.pushState(null, '', '#/voz');
    const v = S.content.voice || {};
    stage = document.createElement('div');
    stage.className = 'stage';
    stage.setAttribute('role', 'dialog');
    stage.setAttribute('aria-label', v.title || 'Conversación de voz');
    const r = origin && origin.getBoundingClientRect ? origin.getBoundingClientRect() : null;
    stage.style.setProperty('--sx', r ? `${r.left + r.width / 2}px` : '50%');
    stage.style.setProperty('--sy', r ? `${r.top + r.height / 2}px` : '50%');
    stage.innerHTML = `
      <div class="stage-top"><span class="mono">${esc(S.content.client)}</span>
        <div class="vprog" aria-label="Progreso">
          <div class="vsegs">${S.content.parts.map((pt) => `<div class="vseg" data-part="${esc(pt.id)}"><b><i></i></b><span>${esc(pt.title)}</span></div>`).join('')}</div>
          <div class="vmeta"><span id="vcount"></span><span id="vclock">00:00 / 15:00</span></div>
        </div>
        <button class="stage-close" id="vclose">Terminar</button></div>
      <div class="stage-mid">
        <canvas id="blob" aria-hidden="true"></canvas>
        <p class="vstate" id="vstate" aria-live="polite">${autostart ? 'Conectando' : 'Toca para empezar'}</p>
        <div class="captions" aria-live="polite"><p class="me" id="capMe"></p><p class="ai" id="capAi"></p></div>
        <p class="verr" id="verr" hidden></p>
        <div id="vafter"></div>
      </div>
      <div class="stage-foot">
        <button class="textlink" id="vform">${esc(S.content.welcome.formCta || 'Prefiero escribir')}</button>
        <p class="micnote">${fmt(v.micNote || '')}</p>
      </div>`;
    document.body.appendChild(stage);
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => stage && stage.classList.add('open')));
    document.getElementById('vclose').onclick = () => (conv ? endVoice() : closeVoice('#/'));
    document.getElementById('vform').onclick = () => closeVoice('#/p/' + S.content.parts[0].id);
    document.getElementById('blob').onclick = () => { if (!conv) startVoice(); };
    mode = 'idle'; level = 0; speak = 0; heard = 0;
    vprogress();
    draw();
    if (autostart) startVoice();
  }

  function closeVoice(hash) {
    endVoice();
    if (!stage) { if (hash) location.hash = hash; return; }
    const s = stage; stage = null;
    cancelAnimationFrame(raf);
    s.classList.add('closing'); s.classList.remove('open');
    setTimeout(() => { s.remove(); document.body.style.overflow = ''; }, REDUCED ? 0 : 720);
    if (hash) { if (location.hash === hash) route(); else location.hash = hash; }
  }

  const vset = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  function vfail(msg) {
    const e = document.getElementById('verr'); if (e) { e.textContent = msg; e.hidden = false; }
    vset('vstate', 'Toca para intentarlo de nuevo');
    mode = 'idle';
  }

  async function startVoice() {
    if (conv) return;
    document.getElementById('verr').hidden = true;
    document.getElementById('vafter').innerHTML = '';
    vset('vstate', 'Conectando');
    try {
      await navigator.mediaDevices.getUserMedia({audio: true});
    } catch {
      return vfail('Sin permiso para el micrófono no puedo escucharte. Actívalo en el navegador o sigue por escrito.');
    }
    let signed;
    try {
      signed = (await api('voice')).signed_url;
    } catch (e) {
      if (e.status === 403) {
        store.set('pk_sesion_novoice_' + S.user.id, true); S.user.voice = false;
        toast('La conversación de voz no está disponible. Puedes seguir por escrito.');
        return closeVoice('#/p/' + S.content.parts[0].id);
      }
      return vfail('No se ha podido conectar. Vuelve a intentarlo en un momento.');
    }
    // what she needs to pick up where the last conversation (or the form) left off
    const qs = allQ();
    const real = (q) => hasAnswer(q.id) && S.answers[q.id].answer !== '·';
    const done = qs.filter(real), open = qs.filter((q) => !real(q));
    const short = (x, n) => { const t = String(x || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
    const back = done.length > 0;
    const vars = {
      nombre: S.user.name,
      codigo: String(store.get(CODE_KEY) || ''),
      respondidas: done.map((q) => q.id).join(', ') || 'ninguna',
      es_retorno: back ? 'sí' : 'no',
      saludo: back ? `¡Hola de nuevo, ${S.user.name}! Seguimos donde lo dejamos.` : `¡Hola, ${S.user.name}! Encantada. Cuando quieras, empezamos.`,
      resumen_previo: done.map((q) => `${q.id} (${short(plain(q.text), 70)}): ${short(S.answers[q.id].answer || S.answers[q.id].note, 180)}`).join(' | ') || 'nada todavía',
      temas: topicsBlock((id) => done.some((q) => q.id === id)),
    };
    try {
      const {Conversation} = await import(SDK);
      closing = ''; linked = false;
      conv = await Conversation.startSession({
        signedUrl: signed,
        dynamicVariables: vars,
        clientTools: {cerrar_voz: async (p) => { closing = String((p && p.motivo) || 'completa'); scheduleEnd(); }},
        onConnect: () => { linked = true; mode = 'listening'; vset('vstate', 'Te escucho'); startClock(); },
        onAgentToolResponse: (p) => onToolSaved(p),
        onDisconnect: () => onVoiceEnd(),
        onError: () => vfail('La conexión se ha cortado. Lo que dijiste ya está guardado.'),
        onModeChange: (m) => {
          mode = (m && m.mode) === 'speaking' ? 'speaking' : 'listening';
          vset('vstate', mode === 'speaking' ? 'Hablando' : 'Te escucho');
        },
        onMessage: (m) => {
          const who = (m && (m.source || m.role)) || '';
          const text = (m && m.message) || '';
          if (!text) return;
          // your last line stays above her reply until you speak again, so you can read what she heard
          if (who === 'user') { vset('capMe', text); vset('capAi', ''); } else vset('capAi', text);
        },
      });
    } catch {
      conv = null;
      vfail('No se ha podido iniciar la conversación. Vuelve a intentarlo o sigue por escrito.');
    }
  }

  // the topics the agent may ask about in this call: only the pending ones (same format as n8n/topics.mjs)
  function topicsBlock(isDone) {
    const out = [];
    for (const p of S.content.parts) {
      const pending = p.topics.map((t) => ({t, qs: t.questions.filter((q) => !isDone(q.id))})).filter((x) => x.qs.length);
      if (!pending.length) continue;
      out.push(`\n## ${p.title}`);
      for (const {t, qs} of pending) {
        if (t.context) out.push(`Contexto de "${t.title}"${t.key ? ' (clave)' : ''}: ${plain(t.context)}`);
        for (const q of qs) {
          let line = `- [${q.id}] ${plain(q.voz || q.text)}${t.key ? ' (clave)' : ''}`;
          if (q.options) line += `\n  Opciones para guardar: ${q.options.join(' | ')}`;
          if (q.hint) line += `\n  Pista: ${plain(q.hint)}`;
          if (q.bridge) line += `\n  Enlace (orientación interna, no la leas): ${q.bridge}`;
          out.push(line);
        }
      }
    }
    return out.join('\n') || 'No queda ningún tema pendiente.';
  }

  // let the goodbye finish before hanging up
  function scheduleEnd() {
    clearTimeout(endTimer);
    const t0 = Date.now();
    const tick = () => {
      if (!conv) return;
      if ((mode !== 'speaking' && Date.now() - t0 > 1200) || Date.now() - t0 > 9000) return endVoice();
      endTimer = setTimeout(tick, 300);
    };
    endTimer = setTimeout(tick, 600);
  }
  function endVoice() {
    if (!conv) return;
    try { conv.endSession(); } catch {}
  }

  async function onVoiceEnd() {
    const c = conv; conv = null; mode = 'idle';
    // a session that drops before it ever connected is a failed start, not a finished conversation
    if (!linked) { clearInterval(clock); return vfail('No se ha podido iniciar la conversación. Recarga la página y vuelve a intentarlo.'); }
    linked = false;
    clearTimeout(endTimer); clearInterval(clock); clearTimeout(refetch);
    let id = ''; try { id = c && c.getId(); } catch {}
    if (id) api('voiceEnd', {conversation_id: id}, {keepalive: true}).catch(() => {});
    try { const fresh = await api('state'); S.answers = fresh.answers || {}; S.status = fresh.status; S.user = fresh.user; } catch {}
    refreshCounts(); vprogress();
    if (closing === 'conducta') {
      store.set('pk_sesion_novoice_' + S.user.id, true);
      toast('La conversación de voz se ha cerrado. Puedes seguir por escrito.');
      return closeVoice('#/p/' + S.content.parts[0].id);
    }
    if (!stage) return;
    const done = answeredCount(), total = allQ().length;
    vset('vstate', 'Conversación terminada');
    vset('capAi', `Gracias. Lo que has contado ya está guardado${done ? `: ${done} de ${total} temas con respuesta` : ''}.`);
    vset('capMe', '');
    const after = document.getElementById('vafter');
    after.innerHTML = `<div class="again">
      <button class="btn" id="vagain">Seguir hablando <span class="ar">●</span></button>
      <button class="btn ghost" id="vsum">Ver resumen</button></div>`;
    document.getElementById('vagain').onclick = () => startVoice();
    document.getElementById('vsum').onclick = () => closeVoice('#/fin');
  }

  // ---- progress: each save the agent makes arrives as a tool response; the question id is read
  // from it when present, otherwise the saved answers are fetched again (debounced)
  function vprogress(pulseId) {
    if (!stage) return;
    S.content.parts.forEach((pt) => {
      const [a, n] = partCount(pt);
      const seg = stage.querySelector(`.vseg[data-part="${pt.id}"]`);
      if (!seg) return;
      seg.querySelector('i').style.width = (n ? (a / n) * 100 : 0) + '%';
      seg.classList.toggle('on', a > 0);
      if (pulseId === pt.id) { seg.classList.remove('pulse'); void seg.offsetWidth; seg.classList.add('pulse'); setTimeout(() => seg.classList.remove('pulse'), 900); }
    });
    vset('vcount', `${answeredCount()} / ${allQ().length} temas`);
  }
  function onToolSaved(p) {
    const txt = JSON.stringify(p || {});
    if (txt.indexOf('guardar_respuesta') === -1) return;
    const m = txt.match(/\b(P1\.\d+|[AB]\d+\.\d+)\b/);
    if (m) {
      const qid = m[1];
      if (!hasAnswer(qid)) S.answers[qid] = {answer: '·', note: ''};
      const part = S.content.parts.find((pt) => partQ(pt).some((q) => q.id === qid));
      vprogress(part && part.id);
      refreshCounts();
      return;
    }
    clearTimeout(refetch);
    refetch = setTimeout(async () => {
      try { const f = await api('state'); S.answers = f.answers || {}; vprogress(); refreshCounts(); } catch {}
    }, 5000);
  }

  // ---- time: 15 minutes. The page tells the agent when to move on or wrap up (it cannot keep time itself)
  const mmss = (x) => `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
  function startClock() {
    clearInterval(clock); t0 = Date.now(); sent = {};
    const note = (key, text) => { if (sent[key] || !conv) return; sent[key] = true; try { conv.sendContextualUpdate(text); } catch {} };
    clock = setInterval(() => {
      if (!conv) return clearInterval(clock);
      const sec = (Date.now() - t0) / 1000;
      const el = document.getElementById('vclock');
      if (el) { el.textContent = `${mmss(sec)} / 15:00`; el.classList.toggle('late', sec > LIMIT - 120); }
      const [p1] = S.content.parts;
      const partDone = (i) => { const pt = S.content.parts[i]; return pt ? partCount(pt)[0] : 0; };
      if (sec > 4 * 60 && p1) note('p2', 'Aviso de tiempo: llevamos unos 4 minutos. Si aún no has pasado a "Historia y marca", termina la pregunta en curso y pasa a esa parte.');
      if (sec > 9 * 60) note('p3', `Aviso de tiempo: llevamos unos 9 minutos. ${partDone(2) ? 'Sigue con los temas clave que falten de "Qué vendéis".' : 'Pasa ya a "Qué vendéis", empezando por los temas clave.'}`);
      if (sec > LIMIT - 120) note('wrap', 'Aviso de tiempo: quedan unos 2 minutos. Termina el tema en curso, pregunta si hay algo más que Pedro deba saber y despídete.');
      if (sec > LIMIT) note('end', 'Aviso de tiempo: se ha acabado el tiempo. Despídete ahora en una frase y cierra con terminar_entrevista y cerrar_voz, motivo "pausa" si quedan temas o "completa" si no.');
      if (sec > LIMIT + 45) { clearInterval(clock); endVoice(); }
    }, 1000);
  }

  // ---- the living shape: a closed curve whose radius is moved by slow layered waves
  // plus the current voice level (microphone while listening, agent while speaking)
  function draw() {
    const cv = document.getElementById('blob');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const t0 = performance.now();
    const frame = (now) => {
      if (!stage || !document.body.contains(cv)) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const size = cv.clientWidth * dpr;
      if (cv.width !== size) { cv.width = size; cv.height = size; }
      const t = (now - t0) / 1000 * (REDUCED ? .35 : 1);
      let target = 0;
      if (conv) { try { target = mode === 'speaking' ? conv.getOutputVolume() : conv.getInputVolume(); } catch {} }
      level += (Math.min(1, target * 2.2) - level) * .18;
      speak += ((mode === 'speaking' ? 1 : 0) - speak) * .06;
      const idle = mode === 'idle' ? 1 : 0;
      ctx.clearRect(0, 0, size, size);
      const cx = size / 2, cy = size / 2, R = size * .27 * (1 + idle * .03 * Math.sin(t * 1.4));
      const layer = (scale, phase, alpha, c0, c1) => {
        const N = 96, pts = [];
        for (let i = 0; i < N; i++) {
          const a = (i / N) * Math.PI * 2;
          const wave = Math.sin(a * 3 + t * .9 + phase) * .5 + Math.sin(a * 5 - t * 1.25 + phase * 2) * .3 + Math.sin(a * 2 + t * .55 - phase) * .2;
          const pulse = level * (.22 + .1 * Math.sin(a * 4 + t * 3.1 + phase));
          const r = R * scale * (1 + wave * (.045 + level * .09) + pulse);
          pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
        }
        ctx.beginPath();
        for (let i = 0; i <= N; i++) {
          const p = pts[i % N], q = pts[(i + 1) % N];
          const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
          if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p[0], p[1], mx, my);
        }
        ctx.closePath();
        const g = ctx.createRadialGradient(cx - R * .25, cy - R * .3, R * .1, cx, cy, R * scale * 1.35);
        g.addColorStop(0, c0); g.addColorStop(1, c1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = g;
        ctx.fill();
        ctx.globalAlpha = 1;
      };
      const mix = (a, b, k) => a.map((v, n) => Math.round(v + (b[n] - v) * k));
      const rgb = (c, al = 1) => `rgba(${c[0]},${c[1]},${c[2]},${al})`;
      // brand: sumi ground; seal red is the person (the hand), electric blue is the agent (the machine)
      const INK = [243, 239, 230], SEAL = [207, 54, 32], BLUE = [47, 39, 224], BLUE_T = [75, 66, 245];
      heard += ((mode === 'listening' ? 1 : 0) - heard) * .06;
      const base = mix(mix(INK, SEAL, heard), BLUE, speak);
      const inner = mix(mix(INK, SEAL, heard * .85), BLUE_T, speak);
      const restA = .3 + (1 - idle) * .7;
      layer(1.16, 2.1, .1 + level * .12, rgb(base), rgb(base, 0));
      layer(1, 0, restA, rgb(base), rgb(base));
      layer(.6, 4.2, .35 * restA, rgb(inner), rgb(inner));
      raf = requestAnimationFrame(frame);
    };
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- saving
  function edit(qid, f, value) {
    const cur = S.answers[qid] || {answer: '', note: ''};
    S.answers[qid] = {...cur, [f]: value};
    dirty.set(qid, {answer: S.answers[qid].answer || '', note: S.answers[qid].note || '', v: ++ver});
    persistDraft();
    refreshCounts();
    setSaved('busy');
    schedule(4000); // each save is one n8n execution, so wait for a pause in typing
  }
  function persistDraft() {
    const o = {}; dirty.forEach((d, k) => { o[k] = {answer: d.answer, note: d.note}; });
    if (dirty.size) store.set(draftKey(), o); else store.del(draftKey());
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(flushNow, ms); }
  async function flushNow(keepalive) {
    clearTimeout(timer);
    if (!dirty.size) return;
    if (inflight) { schedule(600); return; }
    inflight = true;
    const batch = [...dirty.entries()];
    setSaved('busy');
    try {
      await api('save', {items: batch.map(([qid, d]) => ({qid, answer: d.answer, note: d.note}))}, {keepalive});
      // only clear what did not change while the request was out
      for (const [qid, d] of batch) if (dirty.get(qid) && dirty.get(qid).v === d.v) dirty.delete(qid);
      retry = 0;
      persistDraft();
      setSaved(dirty.size ? 'busy' : 'ok');
      if (dirty.size) schedule(800);
    } catch (e) {
      if (e.status === 401) { inflight = false; store.del(CODE_KEY); toast('El código ya no es válido. Lo escrito sigue guardado en este navegador.'); return renderLogin(); }
      setSaved('err');
      retry = Math.min(retry + 1, 6);
      schedule(2000 * retry);
    } finally {
      inflight = false;
    }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(true); });
  window.addEventListener('beforeunload', (e) => { if (dirty.size) { flushNow(true); e.preventDefault(); e.returnValue = ''; } });

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
  }

  boot();
})();
</script>
</body>
</html>
